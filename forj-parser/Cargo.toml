[package]
name = "forj-parser"
description = "A helper crate of forj for parsing a SystemVerilog source file"
version = "0.1.1"
authors = ["Aidan McNay <aidanmcnay@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Aidan-McNay/forj"
readme = "../README.md"
keywords = ["systemverilog"]
categories = ["development-tools", "parsing"]

[dependencies]
ariadne = { version = "0.5.1", features = ["auto-color"] }
forj-syntax = { version = "0.1.0", path = "../forj-syntax" }
logos = { git = "https://github.com/maciejhirsz/logos", rev = "030e589", version = "0.16.1" }
winnow = "0.7.13"
elsa = "1.11.2"

[dev-dependencies]
clap = { version = "4.5.39", features = ["derive"] }

[features]
parse_lossless = ["lossless"]
lossless = ["forj-syntax/lossless"]
